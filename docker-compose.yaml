version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: narsunstream-postgres
    environment:
      POSTGRES_DB: narsunstream
      POSTGRES_USER: narsunstream
      POSTGRES_PASSWORD: narsunstream
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narsunstream"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:99923a87182ae9252b421dda65c935b9c06b1444
    container_name: narsunstream-garage
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # S3 Web / Static Hosting
      - "3903:3903"   # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/data
    restart: on-failure

volumes:
  postgres-data:
  garage-data: